# Temporary: prints the claims GitHub's OIDC token carries (never the token itself), to match the AWS trust rule.
name: OIDC probe
on:
  pull_request:
    paths: [".github/workflows/oidc-probe.yml"]
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Show the token's sub and aud
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          payload=$(echo "$token" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          echo "$payload" | base64 -d | jq '{sub, aud, repository, repository_id, repository_owner, ref, iss}'
